 <path d="M220 0V-420L280 -485 340 -420V0Z" fill="url(#tower)" stroke="#35477c" stroke-width="6"/><path d="M220 -420H340" stroke="#63e7f1" stroke-width="5"/><rect x="239" y="-400" width="82" height="370" fill="url(#windows)"/>
