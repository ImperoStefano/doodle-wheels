<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900">
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#080d25"/><stop offset=".4" stop-color="#171c46"/><stop offset=".75" stop-color="#27285b"/><stop offset="1" stop-color="#090f28"/></linearGradient>
 <linearGradient id="tower" x2="1" y2="0"><stop stop-color="#151d40"/><stop offset=".45" stop-color="#26315d"/><stop offset="1" stop-color="#10182f"/></linearGradient>
