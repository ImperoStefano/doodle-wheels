 <radialGradient id="planet"><stop stop-color="#a4a8ff"/><stop offset=".5" stop-color="#6757c9"/><stop offset="1" stop-color="#28265d"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
