<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900">
<defs>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#071d3d"/><stop offset=".27" stop-color="#0b4664"/><stop offset=".58" stop-color="#0c7181"/><stop offset="1" stop-color="#031a31"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#e2fff0" stop-opacity=".9"/><stop offset=".28" stop-color="#9ef5df" stop-opacity=".35"/><stop offset="1" stop-color="#57bed1" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#b3f3df"/><stop offset=".38" stop-color="#4ba9a6"/><stop offset="1" stop-color="#124d68"/></linearGradient>
