<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V25.2 – ruote e fulcri ancorati</title><style>
*{box-sizing:border-box}body{background:#151925;color:#f7f8fd;font:15px system-ui;margin:0;padding:24px}h1{margin:0;font-size:27px}p{color:#b8c2d6;margin:8px 0 19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1240px;margin:auto}.item{background:#242d44;border:1px solid #424e70;border-radius:15px;overflow:hidden}.label{padding:12px 16px;font-weight:700}.small{font-size:12px;color:#b7c2df;font-weight:400}canvas{display:block;width:100%;height:auto}@media(max-width:680px){.grid{grid-template-columns:1fr}} </style>
<h1>V25.2 · Collaudo visuale degli ancoraggi</h1><p>Elementi disegnati dagli stessi moduli Canvas del gioco. La linea del suolo è inclinata; il rendering cambia quota come sui telefoni. La fisica reale richiede Matter.js.</p>
<div class="grid" id="grid"></div>
<script>
// This gallery ONLY replaces terrain data for deterministic sloped drawing;
// obstacle rendering uses the production modules below, unchanged.
const Terrain={height:x=>18*Math.sin((x-220)*.009)+7*Math.sin(x*.021),DYNAMIC_OBSTACLES:[],INTERACTIVE_OBSTACLES:[]};
</script><script src="js/obstacles.js"></script><script src="js/interactive-obstacles.js"></script>
<script>
const cases=[
 {kind:'ashdrum',biome:'inferno',y:260,caption:'Ruota magmatica · terreno in pendenza',category:'dynamic'},
 {kind:'ashdrum',biome:'inferno',y:235,caption:'Ruota magmatica · inquadratura bassa',category:'dynamic'},
 {kind:'tilt',biome:'paradise',y:260,caption:'Bilancia celeste · supporti a terra',category:'interactive'},
 {kind:'tilt',biome:'classic',y:235,caption:'Leva classica · fulcro e base',category:'interactive'},
 {kind:'seesaw',biome:'classic',y:260,caption:'Leva meccanica · piedi indipendenti',category:'dynamic'},
 {kind:'waterwheel',biome:'atlantis',y:235,caption:'Ruota idraulica · appoggio visibile',category:'dynamic'}
];
for(const [index,s] of cases.entries()){
 const card=document.createElement('div');card.className='item';card.innerHTML=`<div class="label">${s.caption}<div class="small">Oggetto collider: ${s.kind} · terreno viewport=${s.y}</div></div><canvas width="610" height="325"></canvas>`;
 document.getElementById('grid').appendChild(card);const c=card.querySelector('canvas'),ctx=c.getContext('2d');
 const gy=s.y,center=305,poseT=1100,obs={id:0,x:center,kind:s.kind,biome:s.biome,period:3.9,phase:1.1};
 ctx.fillStyle=s.biome==='inferno'?'#402a3a':s.biome==='atlantis'?'#0c405e':s.biome==='paradise'?'#7891bd':'#7798ae';ctx.fillRect(0,0,610,325);
 ctx.save();ctx.fillStyle=s.biome==='inferno'?'#4a252b':s.biome==='atlantis'?'#195d6e':'#416e68';ctx.beginPath();ctx.moveTo(0,325);
 for(let x=0;x<=610;x+=4){const t=gy-Terrain.height(x);if(x===0)ctx.lineTo(0,t);else ctx.lineTo(x,t);}ctx.lineTo(610,325);ctx.closePath();ctx.fill();
 ctx.strokeStyle=s.biome==='inferno'?'#ff9760':'#f4db99';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=610;x+=4){const t=gy-Terrain.height(x);if(x===0)ctx.moveTo(x,t);else ctx.lineTo(x,t);}ctx.stroke();ctx.restore();
 if(s.category==='dynamic'){
   const pose=DynamicObstacles.pose(obs,poseT);
   DynamicObstacles.setRemoteStates(null);DynamicObstacles.setRemoteStates([[pose.x,pose.y,pose.angle||0]]);
   DynamicObstacles.draw(ctx,0,610,gy,poseT,[obs]);
 }else{
   const p={x:center,y:520-Terrain.height(center)-39};
   InteractiveObstacles.clearClient();InteractiveObstacles.receive([[0,p.x,p.y,.16,0]]);
   InteractiveObstacles.draw(ctx,0,610,gy,true,undefined,[obs]);
 }
 ctx.fillStyle='rgba(250,251,255,.86)';ctx.font='13px system-ui';ctx.fillText('Suolo',12,310);
}
</script></html>
